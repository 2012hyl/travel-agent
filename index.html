<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>旅行规划师 · 景点验证版</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* ===== 完整样式，与之前一致（略作调整以容纳新输入框） ===== */
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0c0b09;min-height:100vh;display:flex;justify-content:center;padding:20px;color:#f5f0e8;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;line-height:1.6;overflow-x:hidden;position:relative}
    body::before{content:'';position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse 80% 60% at 20% 30%, rgba(251,191,36,0.06) 0%, transparent 60%),radial-gradient(ellipse 60% 50% at 80% 70%, rgba(245,240,232,0.04) 0%, transparent 55%),radial-gradient(ellipse 50% 40% at 50% 50%, rgba(251,146,60,0.03) 0%, transparent 50%);pointer-events:none}
    body::after{content:'';position:fixed;inset:0;z-index:-2;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px;pointer-events:none;mix-blend-mode:overlay}
    #cursor-glow{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.07) 0%,transparent 70%);pointer-events:none;z-index:-1;transform:translate(-50%,-50%);opacity:0;filter:blur(60px)}
    @media(min-width:820px){#cursor-glow{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(24px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes slideInRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes pulse-glow{0%,100%{box-shadow:0 0 20px rgba(251,191,36,0.15)}50%{box-shadow:0 0 40px rgba(251,191,36,0.3)}}
    .container{width:100%;max-width:600px;display:flex;flex-direction:column;gap:18px;animation:fadeInUp 0.8s cubic-bezier(0.23,1,0.32,1) both}
    .header{text-align:center;padding:32px 0 16px;position:relative;animation:fadeInUp 0.7s cubic-bezier(0.23,1,0.32,1) 0.1s both}
    .header .emoji-wrap{position:relative;display:inline-block;margin-bottom:12px}
    .header .emoji{font-size:44px;display:block;position:relative;z-index:1;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 6px 20px rgba(251,191,36,0.35))}
    .header .emoji-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;background:radial-gradient(circle,rgba(251,191,36,0.18) 0%,transparent 70%);border-radius:50%;animation:pulse-glow 3s ease-in-out infinite}
    .header h1{color:#fff;font-size:28px;font-weight:700;letter-spacing:-0.3px;background:linear-gradient(135deg,#fff 0%,#fef3c7 40%,#fde68a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .header p{color:#a09888;font-size:13px;margin-top:8px;letter-spacing:0.3px}
    .card{background:rgba(255,253,245,0.028);border:1px solid rgba(255,245,230,0.06);border-radius:22px;padding:24px;backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);box-shadow:inset 0 0.5px 0 0 rgba(255,245,230,0.1),0 8px 32px rgba(0,0,0,0.35);transition:all 0.45s cubic-bezier(0.23,1,0.32,1);position:relative;overflow:hidden;animation:fadeInUp 0.6s cubic-bezier(0.23,1,0.32,1) both}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,245,230,0.12),transparent)}
    .card:hover{background:rgba(255,253,245,0.045);border-color:rgba(255,245,230,0.12);box-shadow:inset 0 0.5px 0 0 rgba(255,245,230,0.1),0 12px 48px rgba(0,0,0,0.45),0 0 0 1px rgba(251,191,36,0.08);transform:translateY(-2px)}
    .card-title{color:#f5f0e8;font-size:12px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:10px;letter-spacing:0.8px;text-transform:uppercase}
    .card-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,245,230,0.08),transparent);margin-left:4px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-group{display:flex;flex-direction:column;gap:6px;animation:fadeInUp 0.5s cubic-bezier(0.23,1,0.32,1) both}
    .form-group:nth-child(1){animation-delay:0.05s}
    .form-group:nth-child(2){animation-delay:0.1s}
    .form-group:nth-child(3){animation-delay:0.15s}
    .form-group:nth-child(4){animation-delay:0.2s}
    .form-group:nth-child(5){animation-delay:0.25s}
    .form-group:nth-child(6){animation-delay:0.3s}
    .form-group:nth-child(7){animation-delay:0.35s}
    .form-group:nth-child(8){animation-delay:0.4s}
    .form-group.full{grid-column:1/-1}
    .form-group label{color:#5c5648;font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;display:flex;align-items:center;gap:5px}
    .form-group input,.form-group select{width:100%;padding:12px 14px;background:rgba(255,253,245,0.03);border:1px solid rgba(255,245,230,0.07);border-radius:10px;color:#f5f0e8;font-size:13.5px;outline:none;transition:all 0.35s cubic-bezier(0.23,1,0.32,1);font-family:inherit}
    .form-group input:hover,.form-group select:hover{border-color:rgba(255,245,230,0.14);background:rgba(255,253,245,0.045)}
    .form-group input:focus,.form-group select:focus{border-color:#fbbf24;background:rgba(251,191,36,0.06);box-shadow:0 0 0 3px rgba(251,191,36,0.1),0 0 30px rgba(251,191,36,0.08),inset 0 1px 2px rgba(251,191,36,0.05)}
    .form-group select option{background:#1a1814;color:#f5f0e8}
    .form-group input::placeholder{color:rgba(92,86,72,0.7)}
    .form-group.error input,.form-group.error select{border-color:#f87171;animation:shake 0.4s ease;box-shadow:0 0 0 3px rgba(248,113,113,0.1)}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    .form-error-msg{color:#f87171;font-size:11px;margin-top:2px;opacity:0;transform:translateY(-4px);transition:all 0.3s cubic-bezier(0.23,1,0.32,1);height:0;overflow:hidden}
    .form-group.error .form-error-msg{opacity:1;transform:translateY(0);height:auto}
    .input-with-custom{display:flex;gap:8px;align-items:center}
    .input-with-custom select{flex:2;min-width:0}
    .input-with-custom input{flex:1;min-width:70px}
    .input-with-custom .or-label{color:#5c5648;font-size:10px;padding:0 2px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
    .tag-group{display:flex;flex-wrap:wrap;gap:8px}
    .tag{padding:7px 16px;background:rgba(255,253,245,0.025);border:1px solid rgba(255,245,230,0.07);border-radius:20px;color:#a09888;font-size:12px;cursor:pointer;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);user-select:none;position:relative;overflow:hidden;font-weight:500}
    .tag::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#f5f0e8,#fbbf24,#f59e0b);opacity:0;transition:opacity 0.35s cubic-bezier(0.23,1,0.32,1)}
    .tag:hover{border-color:rgba(251,191,36,0.4);color:#f5f0e8;transform:translateY(-1px);box-shadow:0 4px 16px rgba(251,191,36,0.12)}
    .tag.selected{background:rgba(251,191,36,0.10);border-color:#fbbf24;color:#f5f0e8;box-shadow:0 0 0 1px #fbbf24,0 4px 16px rgba(251,191,36,0.15);transform:translateY(-1px) scale(1.02)}
    .tag.selected::before{opacity:0.15}
    .people-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .people-row .pgroup{display:flex;align-items:center;gap:8px;background:rgba(255,253,245,0.02);padding:7px 14px;border-radius:10px;border:1px solid rgba(255,245,230,0.05);transition:all 0.3s cubic-bezier(0.23,1,0.32,1)}
    .people-row .pgroup:hover{border-color:rgba(255,245,230,0.1);background:rgba(255,253,245,0.035)}
    .people-row .pgroup label{font-size:12px;color:#a09888;font-weight:500;text-transform:none;letter-spacing:0}
    .people-row input{width:52px;padding:8px;text-align:center;background:rgba(255,253,245,0.04);border:1px solid rgba(255,245,230,0.07);border-radius:8px;color:#f5f0e8;font-size:13.5px;font-weight:600;transition:all 0.3s cubic-bezier(0.23,1,0.32,1);outline:none}
    .people-row input:focus{border-color:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,0.1);background:rgba(251,191,36,0.05)}
    .btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,#f5f0e8,#fbbf24,#f59e0b);background-size:200% 200%;border:none;border-radius:14px;color:#1a1814;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.4s cubic-bezier(0.23,1,0.32,1);position:relative;overflow:hidden;letter-spacing:0.6px;margin-top:4px;animation:gradient-flow 4s ease infinite}
    @keyframes gradient-flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);background-size:200% 100%;opacity:0;transition:opacity 0.4s ease}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(251,191,36,0.4),0 0 0 1px rgba(251,191,36,0.25)}
    .btn-primary:hover::before{opacity:1;animation:shimmer 2s linear infinite}
    @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
    .btn-primary:active{transform:translateY(0) scale(0.985)}
    .btn-primary:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none;animation:none}
    .btn-secondary{width:100%;padding:12px;background:rgba(255,253,245,0.03);border:1px solid rgba(255,245,230,0.08);border-radius:14px;color:#9a9288;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.35s cubic-bezier(0.23,1,0.32,1);margin-top:10px;position:relative;overflow:hidden;letter-spacing:0.3px}
    .btn-secondary:hover{background:rgba(255,253,245,0.07);border-color:rgba(255,245,230,0.16);color:#f5f0e8;transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.2)}
    .btn-secondary:active{transform:translateY(0)}
    .loading{display:none;text-align:center;padding:50px 20px;animation:fadeIn 0.5s ease}
    .loading.active{display:block}
    .spinner-wrap{position:relative;width:56px;height:56px;margin:0 auto 18px}
    .spinner{position:absolute;inset:0;border:2.5px solid rgba(255,245,230,0.04);border-top-color:#fbbf24;border-right-color:#f59e0b;border-radius:50%;animation:spin 1s linear infinite}
    .spinner-inner{position:absolute;inset:8px;border:2px solid transparent;border-top-color:rgba(251,191,36,0.3);border-radius:50%;animation:spin 1.8s linear infinite reverse}
    .spinner-core{position:absolute;inset:18px;background:linear-gradient(135deg,#f5f0e8,#fbbf24,#f59e0b);border-radius:50%;opacity:0.6;animation:pulse-glow 2s ease-in-out infinite}
    .loading-text{color:#a09888;font-size:15px;font-weight:500;letter-spacing:0.3px}
    .loading-sub{color:#5c5648;font-size:12px;margin-top:8px;letter-spacing:0.2px}
    .result{display:none}
    .result.active{display:block;animation:slideInRight 0.7s cubic-bezier(0.23,1,0.32,1) both}
    .result .card{background:rgba(255,253,245,0.02);border-color:rgba(255,245,230,0.05)}
    .result .card .card-title{justify-content:space-between;font-size:12px}
    .result .card .card-title span:last-child{font-size:11px;color:#5c5648;font-weight:400;background:rgba(255,253,245,0.03);padding:5px 12px;border-radius:20px;border:1px solid rgba(255,245,230,0.05);letter-spacing:0.3px;text-transform:none}
    .result-content{background:rgba(255,253,245,0.015);border:1px solid rgba(255,245,230,0.04);border-radius:18px;padding:28px;color:#d8d4cc;line-height:1.85;font-size:14px;animation:fadeInUp 0.6s cubic-bezier(0.23,1,0.32,1) 0.15s both}
    .result-content h1{font-size:22px;margin:28px 0 16px;padding-bottom:10px;font-weight:700;letter-spacing:-0.2px;background:linear-gradient(135deg,#fff 0%,#fde68a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:relative}
    .result-content h1:first-child{margin-top:0}
    .result-content h1::after{content:'';position:absolute;bottom:0;left:0;width:60px;height:2px;background:linear-gradient(135deg,#f5f0e8,#fbbf24,#f59e0b);border-radius:2px;animation:line-grow 0.8s cubic-bezier(0.23,1,0.32,1) 0.3s both}
    @keyframes line-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .result-content h2{color:#fde68a;font-size:17px;margin:22px 0 12px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:-0.1px}
    .result-content h2::before{content:'';width:4px;height:18px;background:linear-gradient(135deg,#f5f0e8,#fbbf24,#f59e0b);border-radius:2px;flex-shrink:0}
    .result-content h3{color:#b8b0a0;font-size:14.5px;margin:14px 0 10px;font-weight:600;letter-spacing:0.2px}
    .result-content ul,.result-content ol{padding-left:22px;margin:10px 0}
    .result-content li{margin:6px 0;position:relative}
    .result-content li::marker{color:#fbbf24;font-size:1.1em}
    .result-content strong{color:#fbbf24;font-weight:600}
    .result-content table{width:100%;border-collapse:separate;border-spacing:0;margin:16px 0;font-size:13px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,245,230,0.06)}
    .result-content th,.result-content td{border:none;border-bottom:1px solid rgba(255,245,230,0.05);padding:10px 14px;text-align:left}
    .result-content th{background:linear-gradient(135deg,rgba(251,191,36,0.12),rgba(245,240,232,0.06));color:#fde68a;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.8px}
    .result-content tr:last-child td{border-bottom:none}
    .result-content tr:nth-child(even){background:rgba(255,253,245,0.015)}
    .result-content tr:hover{background:rgba(251,191,36,0.04)}
    .result-content blockquote{border-left:3px solid #fbbf24;padding:12px 18px;margin:14px 0;color:#9a9288;background:linear-gradient(90deg,rgba(251,191,36,0.05),transparent);border-radius:0 10px 10px 0;font-style:italic;line-height:1.7}
    .result-content code{background:rgba(255,253,245,0.08);padding:2px 7px;border-radius:5px;font-size:12.5px;color:#fcd34d;font-family:"SF Mono", Monaco, monospace;border:1px solid rgba(255,245,230,0.06)}
    .result-content pre{background:rgba(0,0,0,0.25);padding:16px;border-radius:10px;overflow-x:auto;border:1px solid rgba(255,245,230,0.06);margin:12px 0}
    .result-content pre code{background:none;padding:0;color:#fde68a;border:none;font-size:12px;line-height:1.6}
    .result-content hr{border:none;height:1px;background:linear-gradient(90deg,transparent,rgba(255,245,230,0.1),transparent);margin:24px 0}
    .result-content a{color:#fbbf24;text-decoration:none;border-bottom:1px dotted rgba(251,191,36,0.4);transition:all 0.25s ease}
    .result-content a:hover{border-bottom-color:#fbbf24;color:#fcd34d}
    .result-content p{margin:10px 0}
    .followup-area{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,245,230,0.05);animation:fadeInUp 0.5s cubic-bezier(0.23,1,0.32,1) 0.25s both}
    .followup-area .fu-label{color:#a09888;font-size:12px;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:500;letter-spacing:0.3px}
    .followup-area .fu-row{display:flex;gap:10px}
    .followup-area .fu-row input{flex:1;padding:11px 16px;background:rgba(255,253,245,0.03);border:1px solid rgba(255,245,230,0.07);border-radius:10px;color:#f5f0e8;font-size:13.5px;outline:none;transition:all 0.35s cubic-bezier(0.23,1,0.32,1);font-family:inherit}
    .followup-area .fu-row input:focus{border-color:#fbbf24;background:rgba(251,191,36,0.05);box-shadow:0 0 0 3px rgba(251,191,36,0.1),0 0 25px rgba(251,191,36,0.06)}
    .followup-area .fu-row input::placeholder{color:rgba(92,86,72,0.6)}
    .followup-area .fu-row button{padding:11px 24px;background:linear-gradient(135deg,#f5f0e8,#fbbf24,#f59e0b);border:none;border-radius:10px;color:#1a1814;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.35s cubic-bezier(0.23,1,0.32,1);white-space:nowrap;letter-spacing:0.3px}
    .followup-area .fu-row button:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(251,191,36,0.35)}
    .followup-area .fu-row button:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none}
    .followup-area .fu-answer{margin-top:12px;color:#b8b0a0;font-size:13.5px;padding:18px 20px;background:linear-gradient(135deg,rgba(251,191,36,0.06),rgba(245,240,232,0.03));border-radius:14px;border-left:3px solid #f59e0b;animation:fadeInUp 0.4s cubic-bezier(0.23,1,0.32,1);line-height:1.75;border:1px solid rgba(251,191,36,0.08);border-left-width:3px}
    .followup-area .fu-answer strong{color:#f59e0b}
    .followup-area .fu-answer em{color:#fcd34d;font-style:normal}
    .date-row{display:flex;gap:10px;align-items:center}
    .date-row input{flex:1}
    .date-row span{color:#5c5648;font-size:13px;font-weight:500}
    .tips{color:#5c5648;font-size:11px;text-align:center;margin-top:8px;padding:14px;background:rgba(255,253,245,0.015);border-radius:10px;border:1px solid rgba(255,245,230,0.03);letter-spacing:0.3px;line-height:1.6}
    .tips a{color:#fbbf24;text-decoration:none;border-bottom:1px dotted rgba(251,191,36,0.3)}
    .tips a:hover{border-bottom-color:#fbbf24}
    .qz-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.65);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);z-index:9999;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity 0.4s cubic-bezier(0.23,1,0.32,1)}
    .qz-overlay.active{display:flex;opacity:1}
    .qz-panel{background:linear-gradient(165deg,#1a1814,#12100e);border:1px solid rgba(255,245,230,0.08);border-radius:24px;padding:32px;max-width:520px;width:92%;max-height:82vh;overflow-y:auto;transform:scale(0.88) translateY(30px);opacity:0;transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 32px 96px rgba(0,0,0,0.55),0 0 0 1px rgba(255,245,230,0.05),inset 0 1px 0 rgba(255,245,230,0.08);position:relative}
    .qz-overlay.active .qz-panel{transform:scale(1) translateY(0);opacity:1}
    .qz-panel::before{content:'';position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,rgba(251,191,36,0.4),transparent)}
    .qz-panel h2{color:#fff;font-size:20px;margin-bottom:4px;font-weight:700;letter-spacing:-0.2px;background:linear-gradient(135deg,#fff 0%,#fde68a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .qz-panel .sub{color:#5c5648;font-size:13px;margin-bottom:24px;letter-spacing:0.2px}
    .qz-item{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid rgba(255,245,230,0.04);animation:fadeInUp 0.5s cubic-bezier(0.23,1,0.32,1) both}
    .qz-item:nth-child(1){animation-delay:0.05s}
    .qz-item:nth-child(2){animation-delay:0.1s}
    .qz-item:nth-child(3){animation-delay:0.15s}
    .qz-item:nth-child(4){animation-delay:0.2s}
    .qz-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
    .qz-item .q{color:#f5f0e8;font-size:14.5px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;letter-spacing:-0.1px}
    .qz-item .q::before{content:'';width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#f5f0e8,#fbbf24,#f59e0b);box-shadow:0 0 10px rgba(251,191,36,0.5);flex-shrink:0}
    .qz-item .options{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

<body>

<div id="cursor-glow"></div>

<div class="container">
  <!-- 头部 -->
  <div class="header">
    <div class="emoji-wrap">
      <span class="emoji">🧳</span>
      <div class="emoji-glow"></div>
    </div>
    <div>
      <h1>旅行规划师</h1>
      <p>AI 像朋友一样帮你规划旅行 · 支持追问和 PDF</p>
    </div>
  </div>

  <!-- 表单卡片 -->
  <div class="card">
    <div class="card-title">📋 填写旅行信息</div>
    <div class="form-grid">
      <!-- 始发地 -->
      <div class="form-group" id="fg-from">
        <label>🏠 始发地</label>
        <div class="input-with-custom">
          <select id="fromSelect"><option value="">请选择</option></select>
          <span class="or-label">或</span>
          <input type="text" id="fromCustom" placeholder="输入其他城市">
        </div>
        <div class="form-error-msg"></div>
      </div>
      <!-- 目的地 -->
      <div class="form-group" id="fg-dest">
        <label>🌍 目的地</label>
        <div class="input-with-custom">
          <select id="destSelect"><option value="">请选择</option></select>
          <span class="or-label">或</span>
          <input type="text" id="destCustom" placeholder="输入其他">
        </div>
        <div class="form-error-msg"></div>
      </div>
      <div class="form-group" id="fg-budget">
        <label>💰 预算（元）</label>
        <input type="number" id="budget" placeholder="如：5000" min="100">
        <div class="form-error-msg"></div>
      </div>
      <div class="form-group" id="fg-date">
        <label>📅 日期</label>
        <div class="date-row">
          <input type="date" id="startDate">
          <span>→</span>
          <input type="date" id="endDate">
        </div>
        <span style="color:#5c5648;font-size:11px;margin-top:3px;display:block" id="dayCount">选择日期后自动计算</span>
        <div class="form-error-msg"></div>
      </div>
      <div class="form-group full" id="fg-people">
        <label>👥 出行人员</label>
        <div class="people-row">
          <div class="pgroup"><label>🧑 成人</label><input type="number" id="adults" value="1" min="0" max="20"></div>
          <div class="pgroup"><label>👶 小孩</label><input type="number" id="children" value="0" min="0" max="10"></div>
          <div class="pgroup"><label>👴 老人</label><input type="number" id="elders" value="0" min="0" max="10"></div>
        </div>
        <div class="form-error-msg"></div>
      </div>
      <!-- ===== 新增：景点自由输入 ===== -->
      <div class="form-group full" id="fg-spots">
        <label>📍 想去的景点（可选）</label>
        <input type="text" id="spots" placeholder="如：故宫、长城、天坛（用逗号分隔）">
        <div class="form-error-msg"></div>
        <span style="color:#5c5648;font-size:11px;margin-top:2px">输入后将自动校验景点真实性</span>
      </div>
      <div class="form-group full">
        <label>🚄 城际交通</label>
        <div class="tag-group" id="cityTags">
          <span class="tag" data-val="高铁">🚄 高铁</span>
          <span class="tag" data-val="飞机">✈️ 飞机</span>
          <span class="tag" data-val="火车">🚂 火车</span>
          <span class="tag" data-val="自驾">🚗 自驾</span>
          <span class="tag" data-val="大巴">🚌 大巴</span>
        </div>
      </div>
      <div class="form-group full">
        <label>🚕 景点间交通</label>
        <div class="tag-group" id="localTags">
          <span class="tag" data-val="地铁">🚇 地铁</span>
          <span class="tag" data-val="公交">🚌 公交</span>
          <span class="tag" data-val="打车">🚕 打车</span>
          <span class="tag" data-val="共享单车">🚲 共享单车</span>
          <span class="tag" data-val="步行">🚶 步行</span>
          <span class="tag" data-val="景区专线">🚐 景区专线</span>
        </div>
      </div>
      <div class="form-group full">
        <label>🎯 旅行偏好</label>
        <div class="tag-group" id="prefTags">
          <span class="tag" data-val="美食">🍜 美食</span>
          <span class="tag" data-val="拍照">📸 拍照</span>
          <span class="tag" data-val="购物">🛍️ 购物</span>
          <span class="tag" data-val="自然风光">🏔️ 自然</span>
          <span class="tag" data-val="历史文化">🏛️ 历史</span>
          <span class="tag" data-val="冒险">🧗 冒险</span>
          <span class="tag" data-val="放松度假">🏖️ 放松</span>
          <span class="tag" data-val="亲子">👶 亲子</span>
          <span class="tag" data-val="乡村生活">🌾 乡村</span>
        </div>
      </div>
    </div>
    <button class="btn-primary" id="planBtn" onclick="startPlan()">✨ 开始规划</button>
  </div>

  <!-- 加载 -->
  <div class="loading" id="loading">
    <div class="spinner-wrap"><div class="spinner"></div><div class="spinner-inner"></div><div class="spinner-core"></div></div>
    <div class="loading-text">正在校验景点……</div>
    <p class="loading-sub" id="loadingSub">请稍候</p>
  </div>

  <!-- 结果 -->
  <div class="result" id="result">
    <div class="card">
      <div class="card-title"><span>📝 你的旅行方案</span><span id="resultMeta"></span></div>
      <div class="result-content" id="resultContent"></div>
      <div class="followup-area" id="followupArea">
        <div class="fu-label">💬 对方案有疑问或想调整？追问 AI</div>
        <div class="fu-row">
          <input type="text" id="followupInput" placeholder="如：预算超了，帮我精简；或者多推荐几家餐厅…">
          <button id="followupBtn" onclick="askFollowup()">追问</button>
        </div>
        <div id="followupAnswer" class="fu-answer" style="display:none"></div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px">
        <button class="btn-secondary" onclick="downloadPDF()">📄 下载 PDF</button>
        <button class="btn-secondary" onclick="window.location.reload()">🔄 重新规划</button>
      </div>
    </div>
  </div>

  <p class="tips">💡 AI 生成仅供参考 · 支持追问修改 · 出行前请核实</p>
</div>

<!-- 追问弹窗 -->
<div class="qz-overlay" id="qzOverlay">
  <div class="qz-panel">
    <h2>💬 补充几个小问题</h2>
    <div class="sub">回答后方案会更精准 · 也可跳过</div>
    <div id="qzBody"></div>
    <div class="qz-btns">
      <button class="btn-primary" id="qzConfirmBtn" onclick="confirmQZ()">✨ 确认，开始生成</button>
      <button class="btn-skip" onclick="skipQZ()">跳过，直接生成</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// API 配置：智谱用于验证，DeepSeek用于生成
// ============================================================
const API_URL = 'https://51ai-1.pages.dev/api/proxy';
const MODEL_ZHIPU = 'glm-4-flash';        // 用于景点校验
const MODEL_DEEPSEEK = 'deepseek-chat';   // 用于生成规划

// ============================================================
// 数据 & 工具（保持不变）
// ============================================================
const ALL_CITIES = [
  '北京','上海','广州','深圳','天津','重庆','哈尔滨','长春','沈阳','大连','呼和浩特','乌鲁木齐','拉萨','西宁','兰州','银川','西安',
  '石家庄','太原','济南','青岛','烟台','威海','郑州','洛阳','开封','南京','苏州','无锡','常州','南通','扬州','徐州','杭州','宁波','温州','绍兴','嘉兴','湖州','金华','舟山',
  '合肥','黄山','芜湖','南昌','九江','景德镇','福州','厦门','泉州','武夷山','武汉','宜昌','长沙','张家界','岳阳','凤凰','珠海','佛山','东莞','中山','惠州','汕头','湛江',
  '南宁','桂林','北海','柳州','海口','三亚','万宁','陵水','成都','绵阳','乐山','峨眉山','九寨沟','稻城','康定','贵阳','遵义','安顺','黄果树','昆明','大理','丽江','香格里拉','西双版纳','腾冲',
  '香港','澳门','台北','高雄','台中','台南','花莲',
  '东京','大阪','京都','札幌','首尔','釜山','济州','新加坡','曼谷','清迈','普吉','芭提雅','吉隆坡','槟城','马六甲','河内','胡志明市','岘港','暹粒','金边','仰光','马尼拉','长滩岛','雅加达','巴厘岛','马尔代夫','迪拜','阿布扎比','伊斯坦布尔',
  '伦敦','曼彻斯特','爱丁堡','巴黎','尼斯','里昂','柏林','慕尼黑','法兰克福','罗马','米兰','威尼斯','佛罗伦萨','巴塞罗那','马德里','里斯本','阿姆斯特丹','布鲁塞尔','苏黎世','日内瓦','维也纳','布拉格','布达佩斯','莫斯科','圣彼得堡','雅典','圣托里尼',
  '纽约','洛杉矶','旧金山','拉斯维加斯','芝加哥','西雅图','波士顿','华盛顿','温哥华','多伦多','蒙特利尔','悉尼','墨尔本','布里斯班','黄金海岸','奥克兰','皇后镇','开罗','开普敦','约翰内斯堡','内罗毕','卡萨布兰卡'
];

(function initSelects(){
  const fs = document.getElementById('fromSelect'), ds = document.getElementById('destSelect');
  ALL_CITIES.forEach(c => { fs.add(new Option(c,c)); ds.add(new Option(c,c)); });
})();

(function initCursorGlow(){
  const glow = document.getElementById('cursor-glow');
  let mx = -500, my = -500, cx = -500, cy = -500;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  function animate(){
    cx += (mx - cx) * 0.08;
    cy += (my - cy) * 0.08;
    glow.style.left = cx + 'px';
    glow.style.top = cy + 'px';
    requestAnimationFrame(animate);
  }
  animate();
})();

function getFrom(){
  const sel = document.getElementById('fromSelect').value;
  const custom = document.getElementById('fromCustom').value.trim();
  return custom || sel || '';
}
function getDestination(){
  const sel = document.getElementById('destSelect').value;
  const custom = document.getElementById('destCustom').value.trim();
  return custom || sel || '';
}

document.querySelectorAll('.tag').forEach(t => {
  t.addEventListener('click', function(){
    this.classList.toggle('selected');
    this.style.transform = 'scale(0.95)';
    setTimeout(() => { this.style.transform = ''; }, 120);
  });
});

(function calcDays(){
  const s = document.getElementById('startDate'), e = document.getElementById('endDate'), dc = document.getElementById('dayCount');
  function update(){
    if(s.value && e.value){
      const diff = Math.ceil((new Date(e.value) - new Date(s.value)) / 86400000);
      if(diff > 0) dc.textContent = '共 ' + diff + ' 天';
      else { dc.textContent = '日期范围不正确'; e.value = ''; }
    }
  }
  s.addEventListener('change', update);
  e.addEventListener('change', update);
})();

function getSelected(containerId){
  const arr = [];
  document.querySelectorAll('#' + containerId + ' .tag.selected').forEach(t => arr.push(t.dataset.val));
  return arr;
}

function getFormData(){
  return {
    from: getFrom(),
    destination: getDestination(),
    budget: parseFloat(document.getElementById('budget').value) || 0,
    startDate: document.getElementById('startDate').value,
    endDate: document.getElementById('endDate').value,
    adults: parseInt(document.getElementById('adults').value) || 0,
    children: parseInt(document.getElementById('children').value) || 0,
    elders: parseInt(document.getElementById('elders').value) || 0,
    spots: document.getElementById('spots').value.trim(),
    cityVehicles: getSelected('cityTags'),
    localVehicles: getSelected('localTags'),
    preferences: getSelected('prefTags')
  };
}

function clearErrors(){
  document.querySelectorAll('.form-group').forEach(g => g.classList.remove('error'));
  document.querySelectorAll('.form-error-msg').forEach(e => e.textContent = '');
}

function showError(fieldId, msg){
  const group = document.getElementById(fieldId);
  if(!group) return;
  group.classList.add('error');
  const msgEl = group.querySelector('.form-error-msg');
  if(msgEl) msgEl.textContent = msg;
}

function validateForm(data){
  clearErrors();
  let hasError = false;
  if(!data.from){ showError('fg-from', '请选择或输入始发地'); hasError = true; }
  if(!data.destination){ showError('fg-dest', '请选择或输入目的地'); hasError = true; }
  if(data.from && data.destination && data.from === data.destination){
    showError('fg-dest', '始发地和目的地不能相同');
    hasError = true;
  }
  if(!data.budget || data.budget < 100){ showError('fg-budget', '预算至少100元'); hasError = true; }
  if(!data.startDate || !data.endDate){ showError('fg-date', '请选择完整日期'); hasError = true; }
  const diff = Math.ceil((new Date(data.endDate) - new Date(data.startDate)) / 86400000);
  if(data.startDate && data.endDate && diff < 1){ showError('fg-date', '返程日期必须晚于出发日期'); hasError = true; }
  if(data.adults + data.children + data.elders === 0){ showError('fg-people', '请至少添加1位出行人员'); hasError = true; }
  return hasError ? 'error' : null;
}

// ============================================================
// 新增：景点校验函数（调用智谱）
// ============================================================
async function validateSpots(spotsStr) {
  // 按逗号分割，去除空格，过滤空字符串
  const spots = spotsStr.split(/[,，、\s]+/).filter(s => s.length > 0);
  if (spots.length === 0) return { valid: true, message: '' };

  // 构造校验提示词
  const prompt = `你是一个地理景点核实助手。请判断以下景点是否真实存在，并指出哪些不存在。

景点列表：${spots.join('、')}

请严格按照以下格式输出：
- 存在的景点：列出所有确认存在的景点。
- 不存在的景点：列出所有可能不存在或无法确认的景点，并简要说明原因（如“可能是名称错误”、“位于其他城市”等）。

如果全部存在，只输出“全部存在”。
如果全部不存在，只输出“全部不存在”。

不要输出任何额外内容。`;

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL_ZHIPU,
        messages: [
          { role: 'system', content: '你是一个严谨的景点核实助手，只根据已知知识判断，不要编造信息。' },
          { role: 'user', content: prompt }
        ],
        temperature: 0.1,
        max_tokens: 300,
        stream: false
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const answer = data.choices[0].message.content.trim();

    // 解析回答，判断是否存在无效景点
    const invalidKeywords = ['不存在', '无法确认', '可能不是', '不在', '错误'];
    const hasInvalid = invalidKeywords.some(k => answer.includes(k)) && !answer.includes('全部存在');

    if (hasInvalid) {
      return { valid: false, message: answer };
    } else {
      return { valid: true, message: '✅ 所有景点均确认有效' };
    }
  } catch (e) {
    console.error('校验失败:', e);
    // 如果校验失败，默认通过（避免阻塞用户）
    return { valid: true, message: '⚠️ 校验服务暂不可用，已跳过景点验证' };
  }
}

// ============================================================
// 前置追问系统（不变）
// ============================================================
let qzData = { answers: {} };
let qzResolve = null;

function buildQZQuestions(data){
  const qs = [];
  const dest = data.destination;
  const fuzzyKeywords = ['农村', '乡下', '小镇', '海岛', '山区', '沙漠', '草原', '欧洲', '亚洲', '美洲', '非洲', '南美', '东南亚', '北欧', '南欧', '东欧'];
  const isFuzzy = fuzzyKeywords.some(k => dest.includes(k)) && !ALL_CITIES.some(c => dest.includes(c));
  if(isFuzzy){
    qs.push({
      id: 'dest_detail',
      question: '你提到的"' + dest + '"具体是指哪个国家或地区？',
      type: 'select',
      options: ['法国', '意大利', '西班牙', '葡萄牙', '德国', '瑞士', '奥地利', '荷兰', '比利时', '希腊', '土耳其', '日本', '韩国', '泰国', '越南', '印尼', '其他（输入）'],
      placeholder: '输入具体地名'
    });
  }
  const diff = Math.ceil((new Date(data.endDate) - new Date(data.startDate)) / 86400000);
  const perPersonPerDay = data.budget / (data.adults + data.children * 0.6 + data.elders * 0.8) / Math.max(1, diff);
  if(perPersonPerDay < 300){
    qs.push({
      id: 'budget_style',
      question: '预算相对紧凑，你更倾向？',
      type: 'select',
      options: ['优先省钱（经济型住宿和餐饮）', '优先舒适（可适当超预算）']
    });
  }
  if(diff >= 7){
    qs.push({
      id: 'pace',
      question: '天数较长，你希望？',
      type: 'select',
      options: ['深度慢游（少去几个地方，玩透）', '多城市打卡（多去几个地方）']
    });
  }
  if(data.elders > 0 || data.children > 0){
    qs.push({
      id: 'family_pace',
      question: '有老人/小孩同行，行程节奏？',
      type: 'select',
      options: ['宽松悠闲（每天1-2个点）', '正常节奏']
    });
  }
  if(data.preferences.length === 0){
    qs.push({
      id: 'pref',
      question: '你对什么最感兴趣？',
      type: 'select',
      options: ['美食', '拍照/风景', '历史文化', '购物', '自然/户外', '放松度假']
    });
  }
  return qs.slice(0, 4);
}

function renderQZ(qs){
  const body = document.getElementById('qzBody');
  if(qs.length === 0){
    body.innerHTML = '<p style="color:#5c5648;font-size:14px;text-align:center;padding:24px 0">✨ 信息已经很完整，直接生成方案吧！</p>';
    document.getElementById('qzConfirmBtn').textContent = '✨ 直接生成';
    return;
  }
  let html = '';
  qs.forEach((q, idx) => {
    html += `<div class="qz-item" data-idx="${idx}" style="animation-delay:${idx*0.08}s">
      <div class="q">${q.question}</div>`;
    if(q.type === 'select'){
      html += `<div class="options" data-id="${q.id}">`;
      q.options.forEach(opt => {
        html += `<span class="qz-tag" data-val="${opt}">${opt}</span>`;
      });
      html += `</div>`;
      if(q.placeholder){
        html += `<input class="qz-input" placeholder="${q.placeholder}" data-id="${q.id}">`;
      }
    }
    html += `</div>`;
  });
  body.innerHTML = html;
  body.querySelectorAll('.qz-tag').forEach(tag => {
    tag.addEventListener('click', function(){
      const parent = this.closest('.options');
      parent.querySelectorAll('.qz-tag').forEach(t => t.classList.remove('selected'));
      this.classList.add('selected');
      const input = parent.parentElement.querySelector('.qz-input');
      if(input) input.value = '';
    });
  });
  body.querySelectorAll('.qz-input').forEach(inp => {
    inp.addEventListener('input', function(){
      const parent = this.closest('.qz-item');
      parent.querySelectorAll('.qz-tag').forEach(t => t.classList.remove('selected'));
    });
  });
  document.getElementById('qzConfirmBtn').textContent = '✨ 确认，开始生成';
}

function collectQZAnswers(){
  const items = document.querySelectorAll('.qz-item');
  const ans = {};
  items.forEach(item => {
    const sel = item.querySelector('.qz-tag.selected');
    const inp = item.querySelector('.qz-input');
    let val = '';
    if(sel) val = sel.dataset.val;
    else if(inp && inp.value.trim()) val = inp.value.trim();
    if(val){
      const id = item.querySelector('.options')?.dataset.id || item.querySelector('.qz-input')?.dataset.id || 'unknown';
      ans[id] = val;
    }
  });
  return ans;
}

function openQZ(data){
  return new Promise((resolve) => {
    const overlay = document.getElementById('qzOverlay');
    const qs = buildQZQuestions(data);
    if(qs.length === 0){
      resolve({});
      return;
    }
    qzData = { answers: {}, resolved: false };
    qzResolve = resolve;
    renderQZ(qs);
    overlay.classList.add('active');
    document.getElementById('qzConfirmBtn').onclick = function(){
      const ans = collectQZAnswers();
      qzData.answers = ans;
      qzData.resolved = true;
      overlay.classList.remove('active');
      resolve(ans);
    };
    window.skipQZ = function(){
      qzData.resolved = true;
      overlay.classList.remove('active');
      resolve({});
    };
  });
}
window.confirmQZ = function(){ document.getElementById('qzConfirmBtn').click(); };
window.skipQZ = function(){ document.getElementById('qzOverlay').classList.remove('active'); if(qzResolve) qzResolve({}); };

// ============================================================
// 主流程 —— 先校验景点，再用 DeepSeek 生成
// ============================================================
async function startPlan(){
  const data = getFormData();
  const err = validateForm(data);
  if(err){ 
    const firstErr = document.querySelector('.form-group.error');
    if(firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return; 
  }

  // 景点校验步骤
  const spotsStr = data.spots;
  const loading = document.getElementById('loading');
  const loadingSub = document.getElementById('loadingSub');
  loading.classList.add('active');
  loadingSub.textContent = '正在校验景点……';

  let validationPassed = true;
  if (spotsStr) {
    try {
      const result = await validateSpots(spotsStr);
      if (!result.valid) {
        validationPassed = false;
        alert('❌ 景点校验未通过：\n\n' + result.message + '\n\n请修改后重试。');
        loading.classList.remove('active');
        return;
      } else {
        loadingSub.textContent = '✅ 景点校验通过，正在生成方案……';
        // 短暂显示成功信息
        await new Promise(r => setTimeout(r, 600));
      }
    } catch (e) {
      loading.classList.remove('active');
      alert('校验服务异常，请稍后重试。');
      return;
    }
  } else {
    loadingSub.textContent = '未输入景点，跳过校验，正在生成方案……';
    await new Promise(r => setTimeout(r, 300));
  }

  // 继续前置追问
  const qzAnswers = await openQZ(data);
  const extra = qzAnswers;

  const btn = document.getElementById('planBtn');
  const result = document.getElementById('result');
  btn.disabled = true;
  btn.textContent = '规划中……';
  result.classList.remove('active');

  try {
    const diff = Math.ceil((new Date(data.endDate) - new Date(data.startDate)) / 86400000);
    const peopleTotal = data.adults + data.children + data.elders;
    const peopleDesc = `${data.adults}成人${data.children ? '、'+data.children+'小孩' : ''}${data.elders ? '、'+data.elders+'老人' : ''}`;

    // 构建系统提示（包含景点信息）
    const spotsList = spotsStr ? '，想去的景点：' + spotsStr : '';
    const systemPrompt = `你是拥有10年以上经验的私人旅行顾问。你的职责是像朋友一样帮用户规划旅行，根据预算、时间、人数、兴趣、季节、交通条件，设计一套真实、舒适、可执行、值得回忆的旅行方案。

【重要：处理模糊目的地】
如果用户输入的目的地较模糊（如"欧洲农村"、"日本乡下"等），你应根据预算、天数、偏好推荐3~5个具体国家/地区，并说明理由，然后选择最合适的进行详细规划。

【规划原则】
真实、可执行、减少折返、控制预算、让用户玩得舒服。
如果无法确认某项信息（营业时间、车次、餐厅等），必须明确提醒用户自行确认，不允许编造任何事实。

【输出要求】
使用Markdown输出。不要输出任何解释、不要输出AI说明、不要输出"根据您的要求"。直接开始规划。

【输出结构】
# ✈️ 本次旅行概览
一句话总结这趟旅行

## 🎯 本次旅行关键词
3-5个关键词

## 🚄 城际交通（${data.from} → ${data.destination}）
方式、耗时、参考价格、优缺点（不写具体车次/航班号）

## 🚕 景点间交通
每天景点之间的接驳建议

## 🏨 住宿建议
推荐区域 + 理由 + 适合人群 + 预算范围

## 📅 每日行程
按天给（Day1、Day2…），每天上/下午/晚上核心活动、交通方式简述、为什么这样安排

## 🍜 美食推荐
至少6家真实存在的店铺，每家：推荐菜 + 人均参考 + 为什么值得去

## 🌇 本地人才知道的小众推荐
2-5个，避开游客打卡点

## 💰 预算规划
表格：交通/住宿/餐饮/门票/购物/预留 → 总计，最后点评预算是否合理

## 🎒 必备物品清单
Checklist 格式，按季节分类

## ⚠️ 容易踩坑的地方
至少5条

## ❤️ 我的旅行建议
150字以内，像真正旅行很多次的朋友说的话

【基本信息】
- 出发地：${data.from}
- 目的地：${data.destination}
- 天数：${diff}天
- 预算：${data.budget}元
- 人数：${peopleTotal}人（${peopleDesc}）
- 日期：${data.startDate} 至 ${data.endDate}
- 城际交通偏好：${data.cityVehicles.join('、') || '不限'}
- 景点间交通偏好：${data.localVehicles.join('、') || '不限'}
- 旅行偏好：${data.preferences.join('、') || '无特殊偏好'}
${extra.dest_detail ? '- 目的地具体化：' + extra.dest_detail : ''}
${extra.budget_style ? '- 预算倾向：' + extra.budget_style : ''}
${extra.pace ? '- 行程节奏：' + extra.pace : ''}
${extra.family_pace ? '- 家庭节奏：' + extra.family_pace : ''}
${extra.pref ? '- 主要兴趣：' + extra.pref : ''}
${spotsList ? '- 想去的景点：' + spotsList : ''}`;

    const userMessage = `请为从${data.from}到${data.destination}的${diff}天旅行生成完整方案。${extra.dest_detail ? '目的地具体为：' + extra.dest_detail : ''}${spotsList ? '。用户想去的景点：' + spotsStr : ''}`;

    // 调用 DeepSeek 生成
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL_DEEPSEEK,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userMessage }
        ],
        temperature: 0.7,
        max_tokens: 3000,
        stream: true
      })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (!res.body) throw new Error('No response body');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed === 'data: [DONE]') continue;
        if (!trimmed.startsWith('data: ')) continue;
        try {
          const json = JSON.parse(trimmed.slice(6));
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) fullContent += delta;
        } catch(e) {}
      }
    }

    if (!fullContent) throw new Error('AI 返回内容为空');

    document.getElementById('resultContent').innerHTML = marked.parse(fullContent);
    document.getElementById('resultMeta').textContent = `${data.from} → ${data.destination} · ${diff}天 · ${peopleTotal}人 · ¥${data.budget}`;
    window._lastPlan = fullContent;

    loading.classList.remove('active');
    result.classList.add('active');

    if (window.innerWidth >= 820) {
      setTimeout(() => {
        document.querySelector('.result')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 200);
    }

  } catch(e) {
    loading.classList.remove('active');
    alert('生成失败：' + (e.message || '网络错误，请重试'));
  } finally {
    btn.disabled = false;
    btn.textContent = '✨ 重新规划';
  }
}

// ============================================================
// 后置追问（不变）
// ============================================================
async function askFollowup(){
  const input = document.getElementById('followupInput');
  const btn = document.getElementById('followupBtn');
  const answerDiv = document.getElementById('followupAnswer');
  const question = input.value.trim();
  if(!question) return;
  if(!window._lastPlan){
    answerDiv.textContent = '请先生成方案再追问';
    answerDiv.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.textContent = '思考中…';
  answerDiv.style.display = 'block';
  answerDiv.textContent = '⏳ AI 正在思考…';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL_DEEPSEEK,
        messages: [
          { role: 'system', content: '你是资深旅行顾问，用户对已有方案提出追问，请根据原有方案内容，直接回答用户的追问，给出具体、可执行的建议。如果用户要求修改方案，请只输出修改后的对应部分，不要重复全文。' },
          { role: 'user', content: `原方案：\n${window._lastPlan}\n\n用户追问：${question}` }
        ],
        temperature: 0.6,
        max_tokens: 800,
        stream: false
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const answer = data.choices[0].message.content;
    answerDiv.innerHTML = '💬 ' + marked.parse(answer);
    input.value = '';
  } catch(e) {
    answerDiv.textContent = '追问失败：' + (e.message || '请重试');
  } finally {
    btn.disabled = false;
    btn.textContent = '追问';
  }
}
document.getElementById('followupInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter') askFollowup();
});

  }).from(el).save().then(() => {
    el.style.background = origBg;
    el.style.color = origColor;
  });
}
